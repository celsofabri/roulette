name: Deploy ao GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy com a lib gh-pages
        run: npx --yes gh-pages@6 -d . -b gh-pages -m "Deploy via gh-pages [skip ci]" -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
