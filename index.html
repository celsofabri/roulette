<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta da Sorte</title>
  <style type="text/css" media="screen">

    /* Geral
    ---------------------------------------- */
    html {
      height: 100%;
      background-color: white;
      overflow: hidden;
    }

    body {
      position: relative;
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* palco com perspectiva (corrige a ordem de empilhamento
       para os overlays ficarem na frente da roleta) */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      -webkit-perspective: 4000px;
      -moz-perspective: 4000px;
      perspective: 4000px;
    }

    /* Pião
    ---------------------------------------- */
    #wrapper {
      width: 600px;
      height: 600px;
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -300px;
      margin-top: -300px;
      -webkit-transform-style: preserve-3d;
      -moz-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }

    #piao {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      margin-left: -75px;
      margin-top: -75px;
      -webkit-transform-style: preserve-3d;
      -moz-transform-style: preserve-3d;
      transform-style: preserve-3d;
      will-change: transform;
    }

      #piao .face {
        position: absolute;
        top: 0;
        left: 0;
        width: 150px;
        height: 150px;
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
        border: 4px solid white;
        border-radius: 10px;
        overflow: hidden;
        background-color: white;
        -webkit-backface-visibility: hidden;
        -moz-backface-visibility: hidden;
        backface-visibility: hidden;
        -webkit-transform: rotateY(calc(var(--i) * 30deg)) translateZ(280px);
        -moz-transform: rotateY(calc(var(--i) * 30deg)) translateZ(280px);
        transform: rotateY(calc(var(--i) * 30deg)) translateZ(280px);
      }

        #piao .face img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          pointer-events: none;
        }

        #piao .face .label {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          padding: 16px 4px 4px;
          text-align: center;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size: 12px;
          font-weight: 700;
          color: white;
          background: -webkit-linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0));
          background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0));
          pointer-events: none;
        }

        #piao .face.winner {
          -webkit-animation: destaque 1s ease-in-out infinite;
          animation: destaque 1s ease-in-out infinite;
        }

        @-webkit-keyframes destaque {
          0%   { box-shadow: 0 0 0 3px rgb(200, 0, 0), 0 0 18px 4px rgba(200, 0, 0, 0.55); }
          50%  { box-shadow: 0 0 0 6px rgb(200, 0, 0), 0 0 40px 14px rgba(200, 0, 0, 0.85); }
          100% { box-shadow: 0 0 0 3px rgb(200, 0, 0), 0 0 18px 4px rgba(200, 0, 0, 0.55); }
        }
        @keyframes destaque {
          0%   { box-shadow: 0 0 0 3px rgb(200, 0, 0), 0 0 18px 4px rgba(200, 0, 0, 0.55); }
          50%  { box-shadow: 0 0 0 6px rgb(200, 0, 0), 0 0 40px 14px rgba(200, 0, 0, 0.85); }
          100% { box-shadow: 0 0 0 3px rgb(200, 0, 0), 0 0 18px 4px rgba(200, 0, 0, 0.55); }
        }

    /* Decoração
    ---------------------------------------- */
    #moldura {
      height: 520px;
      width: 520px;
      border: 40px solid rgb(200, 0, 0);
      border-radius: 300px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -300px;
      margin-left: -300px;
      -webkit-transform: translateZ(380px);
      -moz-transform: translateZ(380px);
      transform: translateZ(380px);
      box-shadow:
        inset -1px -2px 0px 3px rgb(150, 0, 0),
        inset -1px -2px 10px 10px rgba(0, 0, 0, 0.5),
        -2px -2px 0px 3px rgb(150, 0, 0),
        -4px -4px 10px 10px rgba(0, 0, 0, 0.5);
    }

    #piao-bg {
      height: 580px;
      width: 580px;
      border-radius: 290px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -290px;
      margin-left: -290px;
      background-color: #222;
      -webkit-transform: translateZ(1px);
      -moz-transform: translateZ(1px);
      transform: translateZ(1px);
    }

    #mute {
      position: absolute;
      right: 20px;
      top: 20px;
      background-color: whiteSmoke;
      background-image: -webkit-linear-gradient(top, white, #DDD);
      background-image: -moz-linear-gradient(top, white, #DDD);
      background-image: linear-gradient(top, white, #DDD);
      border-radius: 40px;
      box-shadow: rgba(0, 0, 0, 0.2) 0px 0px 0px 10px;
      color: #333;
      font-size: 40px;
      line-height: 72px;
      width: 68px;
      height: 70px;
      text-align: center;
      text-decoration: none;
      text-shadow: rgba(255, 255, 255, 0.746094) 0px 1px 1px;
      padding-left: 2px;
      -webkit-transition: box-shadow 0.3s linear;
      -moz-transition: box-shadow 0.3s linear;
      transition: box-shadow 0.3s linear;
      z-index: 100;
    }

      #mute:hover {
        box-shadow: 0 0 0px 6px rgba(0, 0, 0, 0.4);
      }

    #decoracao {
      width: 10000px;
      height: 100%;
      left: -5000px;
      margin: 0 50%;
      position: absolute;
      z-index: -1;
      overflow: hidden;
    }

      #decoracao > div {
        width: 100%;
        height: 60px;
        position: absolute;
        top: 50%;
        border-bottom: 2px solid rgba(0, 0, 0, 0.7);
        border-top: 2px solid rgba(0, 0, 0, 0.7);
        background-color: white;
      }

    /* Resultado (nome do sorteado)
    ---------------------------------------- */
    #result {
      position: fixed;
      top: 20px;
      left: 50%;
      -webkit-transform: translateX(-50%);
      -moz-transform: translateX(-50%);
      transform: translateX(-50%);
      z-index: 100;
      background: #fff;
      border: 3px solid rgb(200, 0, 0);
      border-radius: 16px;
      padding: 12px 30px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 30px;
      font-weight: 900;
      color: #333;
      text-align: center;
      max-width: 90vw;
      -webkit-animation: popIn 0.4s ease;
      animation: popIn 0.4s ease;
    }

      #result:empty {
        display: none;
      }

      #result strong {
        color: rgb(200, 0, 0);
      }

      @-webkit-keyframes popIn {
        from { -webkit-transform: translateX(-50%) scale(0.7); opacity: 0; }
        to   { -webkit-transform: translateX(-50%) scale(1); opacity: 1; }
      }
      @keyframes popIn {
        from { transform: translateX(-50%) scale(0.7); opacity: 0; }
        to   { transform: translateX(-50%) scale(1); opacity: 1; }
      }

    /* Controles do sorteio
    ---------------------------------------- */
    .controls {
      position: fixed;
      left: 50%;
      bottom: 28px;
      -webkit-transform: translateX(-50%);
      -moz-transform: translateX(-50%);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 100;
    }

    button#sortear {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: rgb(200, 0, 0);
      border: none;
      border-radius: 999px;
      padding: 14px 46px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(200, 0, 0, 0.35);
      -webkit-transition: transform 0.12s ease, box-shadow 0.12s ease;
      -moz-transition: transform 0.12s ease, box-shadow 0.12s ease;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

      button#sortear:hover { transform: translateY(-2px); }
      button#sortear:active { transform: translateY(0); box-shadow: 0 3px 10px rgba(200, 0, 0, 0.35); }

    /* Canvas de fogos e confetes
    ---------------------------------------- */
    #fx {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    /* Botão "Participantes"
    ---------------------------------------- */
    #participants {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 100;
      background-color: whiteSmoke;
      background-image: -webkit-linear-gradient(top, white, #DDD);
      background-image: -moz-linear-gradient(top, white, #DDD);
      background-image: linear-gradient(top, white, #DDD);
      border-radius: 999px;
      box-shadow: rgba(0, 0, 0, 0.2) 0px 0px 0px 8px;
      color: #333;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 44px;
      padding: 0 20px;
      text-decoration: none;
      text-shadow: rgba(255, 255, 255, 0.746094) 0px 1px 1px;
      -webkit-transition: box-shadow 0.3s linear;
      -moz-transition: box-shadow 0.3s linear;
      transition: box-shadow 0.3s linear;
    }

      #participants:hover {
        box-shadow: 0 0 0px 6px rgba(0, 0, 0, 0.4);
      }

    /* Seleção de participantes
    ---------------------------------------- */
    #selector {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 300;
      background: rgba(0, 0, 0, 0.62);
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

      #selector.hidden { display: none; }

      #selector .panel {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        max-width: 900px;
        width: 92vw;
        max-height: 88vh;
        overflow: auto;
        padding: 24px 28px 28px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }

      #selector h2 {
        margin: 0 0 4px;
        font-size: 24px;
        color: #333;
      }

      #selector .sub {
        margin: 0 0 18px;
        color: #777;
        font-size: 14px;
      }

      #selector .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 12px;
      }

      #selector .person {
        position: relative;
        border: 3px solid #e0e0e0;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        background: #fafafa;
        -webkit-user-select: none;
        user-select: none;
        -webkit-transition: border-color 0.15s ease, box-shadow 0.15s ease, -webkit-transform 0.15s ease;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      }

        #selector .person:hover { -webkit-transform: translateY(-2px); transform: translateY(-2px); }

        #selector .person.selected {
          border-color: rgb(200, 0, 0);
          box-shadow: 0 4px 14px rgba(200, 0, 0, 0.3);
        }

        #selector .person img {
          width: 100%;
          height: 110px;
          object-fit: cover;
          display: block;
        }

        #selector .person .name {
          padding: 8px 6px 10px;
          font-size: 13px;
          font-weight: 700;
          color: #333;
        }

        #selector .person .check {
          position: absolute;
          top: 6px;
          right: 6px;
          width: 26px;
          height: 26px;
          border-radius: 50%;
          background: #fff;
          border: 2px solid #ccc;
          display: -webkit-flex;
          display: flex;
          -webkit-align-items: center;
          align-items: center;
          -webkit-justify-content: center;
          justify-content: center;
          color: transparent;
          font-size: 15px;
          font-weight: 900;
          -webkit-transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
          transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        #selector .person.selected .check {
          background: rgb(200, 0, 0);
          border-color: rgb(200, 0, 0);
          color: #fff;
        }

      #selector .actions {
        margin-top: 20px;
        display: -webkit-flex;
        display: flex;
        gap: 12px;
        -webkit-justify-content: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      #selector .actions button {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.5px;
        border: none;
        border-radius: 999px;
        padding: 12px 24px;
        cursor: pointer;
        -webkit-transition: -webkit-transform 0.12s ease, box-shadow 0.12s ease;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

        #selector .actions button:hover { -webkit-transform: translateY(-2px); transform: translateY(-2px); }

        #selector .actions button:disabled { opacity: 0.45; cursor: not-allowed; }

        #selector #select-all,
        #selector #select-none {
          background: #eee;
          color: #333;
        }

        #selector #confirm {
          background: rgb(200, 0, 0);
          color: #fff;
          box-shadow: 0 6px 18px rgba(200, 0, 0, 0.35);
        }

    /* Participantes não marcados ficam esmaecidos na roleta */
    #piao .face.dimmed img {
      -webkit-filter: grayscale(1) brightness(0.55);
      filter: grayscale(1) brightness(0.55);
    }

    #piao .face.dimmed .label {
      opacity: 0.5;
    }

  </style>
</head>
<body>
  <!-- palco 3D -->
  <div class="stage">
    <div id="wrapper">
      <div id="piao">
        <div class="face" style="--i:0"><img src="fotos/carla-joia.png" alt="Carla Joia"><span class="label">Carla Joia</span></div>
        <div class="face" style="--i:1"><img src="fotos/celso-fabri.jpg" alt="Celso Fabri"><span class="label">Celso Fabri</span></div>
        <div class="face" style="--i:2"><img src="fotos/douglas-queiroz.jpg" alt="Douglas Queiroz"><span class="label">Douglas Queiroz</span></div>
        <div class="face" style="--i:3"><img src="fotos/glaide-oliveira.jpg" alt="Glaide Oliveira"><span class="label">Glaide Oliveira</span></div>
        <div class="face" style="--i:4"><img src="fotos/guilherme-hernandez.jpg" alt="Guilherme Hernandez"><span class="label">Guilherme Hernandez</span></div>
        <div class="face" style="--i:5"><img src="fotos/helena-dantas.jpg" alt="Helena Dantas"><span class="label">Helena Dantas</span></div>
        <div class="face" style="--i:6"><img src="fotos/henrique-morbin.jpg" alt="Henrique Morbin"><span class="label">Henrique Morbin</span></div>
        <div class="face" style="--i:7"><img src="fotos/jessica-rodrigues.png" alt="Jessica Rodrigues"><span class="label">Jessica Rodrigues</span></div>
        <div class="face" style="--i:8"><img src="fotos/luciana-correa.png" alt="Luciana Correa"><span class="label">Luciana Correa</span></div>
        <div class="face" style="--i:9"><img src="fotos/raquel-nicolau.jpg" alt="Raquel Nicolau"><span class="label">Raquel Nicolau</span></div>
        <div class="face" style="--i:10"><img src="fotos/rodrigo-dangelo.jpg" alt="Rodrigo Dangelo"><span class="label">Rodrigo Dangelo</span></div>
        <div class="face" style="--i:11"><img src="fotos/thalyta-nascimento.jpg" alt="Thalyta Nascimento"><span class="label">Thalyta Nascimento</span></div>
      </div>
      <!-- moldura vermelha -->
      <div id="moldura"></div>
      <!-- background quase preto -->
      <div id="piao-bg"></div>
    </div>
  </div>

  <!-- música de fundo -->
  <audio preload="auto" loop="true">
    <source src="tutururu.mp3" type="audio/mpeg" />
  </audio>
  <!-- botão para dar pause/play na música de fundo -->
  <a href="" id="mute">▶</a>
  <a href="" id="participants">Participantes</a>
  <!-- background listrado -->
  <div id="decoracao"></div>
  <!-- resultado do sorteio -->
  <div id="result"></div>
  <!-- controles -->
  <div class="controls">
    <button id="sortear" style="display:none">Sortear</button>
  </div>
  <!-- fogos e confetes -->
  <canvas id="fx"></canvas>

  <!-- seleção de participantes -->
  <div id="selector">
    <div class="panel">
      <h2>Quem participa do sorteio?</h2>
      <p class="sub">Toque nas pessoas para marcar ou desmarcar.</p>
      <div class="grid" id="selector-grid"></div>
      <div class="actions">
        <button type="button" id="select-all">Marcar todos</button>
        <button type="button" id="select-none">Desmarcar todos</button>
        <button type="button" id="confirm">Começar</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">

    // gera as listras de fundo
    (function () {
      var deco = document.getElementById('decoracao');
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 45; i++) {
        var d = document.createElement('div');
        d.style.webkitTransform = 'rotate(' + (i * 4) + 'deg)';
        d.style.mozTransform = 'rotate(' + (i * 4) + 'deg)';
        d.style.transform = 'rotate(' + (i * 4) + 'deg)';
        frag.appendChild(d);
      }
      deco.appendChild(frag);
    }());

    (function () {
      var piao = document.getElementById('piao');
      var muteBtn = document.querySelector('#mute');
      var audio = document.querySelector('audio');
      var sortearBtn = document.getElementById('sortear');
      var resultEl = document.getElementById('result');
      var faces = Array.prototype.slice.call(document.querySelectorAll('#piao .face'));

      // seleção de participantes
      var selectorEl = document.getElementById('selector');
      var selectorGrid = document.getElementById('selector-grid');
      var confirmBtn = document.getElementById('confirm');
      var selectAllBtn = document.getElementById('select-all');
      var selectNoneBtn = document.getElementById('select-none');
      var participantsBtn = document.getElementById('participants');
      var selected = faces.map(function () { return true; }); // todos marcados por padrão

      var fxCanvas = document.getElementById('fx');
      var fxCtx = fxCanvas.getContext('2d');

      var N = faces.length;           // 12
      var SEG = 360 / N;              // 30° por face
      var SPEED = 360 / 4000;         // graus por ms (1 volta a cada 4s)

      var angle = 0;
      var phase = 'select';           // select | idle | spinning | drawing | done
      var raf = null;
      var lastT = 0;
      var drawTimer = null;

      // estado dos efeitos (fogos + confetes)
      var particles = [];
      var fxRunning = false;
      var fxSession = 0;
      var COLORS = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231',
                    '#911eb4', '#46f0f0', '#f032e6', '#9A6324', '#e6beff'];

      function resizeFx() {
        fxCanvas.width = window.innerWidth;
        fxCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeFx);
      resizeFx();

      function clearWinner() {
        faces.forEach(function (f) { f.classList.remove('winner'); });
      }

      function updateUI() {
        if (phase === 'spinning') {
          sortearBtn.style.display = '';
          sortearBtn.textContent = 'Sortear';
        } else if (phase === 'done') {
          sortearBtn.style.display = '';
          sortearBtn.textContent = 'Começar do zero';
        } else {
          sortearBtn.style.display = 'none';
        }
      }

      function syncSelector() {
        var cards = selectorGrid.children;
        for (var c = 0; c < cards.length; c++) {
          cards[c].classList.toggle('selected', selected[c]);
        }
      }

      function applySelection() {
        var count = 0;
        faces.forEach(function (f, i) {
          var on = selected[i];
          if (on) count++;
          f.classList.toggle('dimmed', !on);
        });
        confirmBtn.textContent = 'Começar (' + count + ')';
        confirmBtn.disabled = count === 0;
      }

      function buildSelector() {
        selectorGrid.innerHTML = '';
        faces.forEach(function (f, i) {
          var name = f.querySelector('.label').textContent;
          var imgSrc = f.querySelector('img').getAttribute('src');
          var p = document.createElement('div');
          p.className = 'person selected';
          p.innerHTML =
            '<img src="' + imgSrc + '" alt="' + name + '">' +
            '<div class="name">' + name + '</div>' +
            '<div class="check">&#10003;</div>';
          p.addEventListener('click', function () {
            selected[i] = !selected[i];
            p.classList.toggle('selected', selected[i]);
            applySelection();
          });
          selectorGrid.appendChild(p);
        });
        applySelection();
      }

      function loop(now) {
        if (phase !== 'spinning') return;
        var dt = now - lastT;
        lastT = now;
        angle -= SPEED * dt;
        piao.style.transform = 'rotateY(' + angle + 'deg)';
        raf = requestAnimationFrame(loop);
      }

      function startSpinning() {
        cancelAnimationFrame(raf);
        phase = 'spinning';
        piao.style.transition = 'none';
        lastT = performance.now();
        raf = requestAnimationFrame(loop);
        updateUI();
      }

      function resetTo(phaseTarget, showPanel) {
        audio.pause();
        audio.currentTime = 0;
        muteBtn.innerHTML = '▶';
        cancelAnimationFrame(raf);
        clearTimeout(drawTimer);
        phase = phaseTarget;
        angle = 0;
        piao.style.transition = 'none';
        piao.style.transform = 'rotateY(0deg)';
        clearWinner();
        resultEl.innerHTML = '';
        clearFx();
        if (showPanel) {
          selectorEl.classList.remove('hidden');
        } else {
          selectorEl.classList.add('hidden');
        }
        updateUI();
      }

      function fullReset() {
        resetTo('idle', false);
      }

      function showSelector() {
        resetTo('select', true);
      }

      function draw() {
        if (phase !== 'spinning') return;
        cancelAnimationFrame(raf);
        phase = 'drawing';
        updateUI();

        var active = [];
        for (var a = 0; a < N; a++) {
          if (selected[a]) active.push(a);
        }
        if (active.length === 0) {
          fullReset();
          return;
        }
        var winner = active[Math.floor(Math.random() * active.length)];

        var targetMod = ((360 - winner * SEG) % 360 + 360) % 360;
        var currentMod = ((angle % 360) + 360) % 360;
        var delta = (targetMod - currentMod + 360) % 360;

        var fullSpins = 4 + Math.floor(Math.random() * 3);
        var target = angle + fullSpins * 360 + delta;
        angle = target;

        var duration = 4000;
        piao.style.transition = 'transform ' + duration + 'ms cubic-bezier(0.15, 0.85, 0.25, 1)';
        piao.style.transform = 'rotateY(' + target + 'deg)';

        drawTimer = setTimeout(function () {
          phase = 'done';
          clearWinner();
          faces[winner].classList.add('winner');
          resultEl.innerHTML = 'Sorteado: <strong>' + faces[winner].querySelector('.label').textContent + '</strong>';
          launchCelebration();
          updateUI();
        }, duration + 60);
      }

      // ---- fogos + confetes ----
      function launchCelebration() {
        var session = ++fxSession;

        // confetes caindo do topo
        for (var i = 0; i < 220; i++) {
          particles.push({
            type: 'confetti',
            x: Math.random() * fxCanvas.width,
            y: -20 - Math.random() * 300,
            vx: (Math.random() - 0.5) * 2,
            vy: 2 + Math.random() * 4,
            size: 6 + Math.random() * 6,
            color: COLORS[(Math.random() * COLORS.length) | 0],
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.3,
            life: 1
          });
        }

        // fogos de artifício (rajadas em sequência)
        var bursts = 6;
        for (var b = 0; b < bursts; b++) {
          (function (delay, sid) {
            setTimeout(function () {
              if (sid !== fxSession) return;
              var cx = fxCanvas.width * (0.2 + 0.6 * Math.random());
              var cy = fxCanvas.height * (0.15 + 0.35 * Math.random());
              var color = COLORS[(Math.random() * COLORS.length) | 0];
              for (var j = 0; j < 50; j++) {
                var ang = Math.random() * Math.PI * 2;
                var speed = 2 + Math.random() * 5;
                particles.push({
                  type: 'firework',
                  x: cx, y: cy,
                  vx: Math.cos(ang) * speed,
                  vy: Math.sin(ang) * speed,
                  size: 2 + Math.random() * 2.5,
                  color: color,
                  life: 1,
                  decay: 0.012 + Math.random() * 0.008
                });
              }
            }, delay);
          }(b * 380, session));
        }

        startFxLoop();
      }

      function startFxLoop() {
        if (fxRunning) return;
        fxRunning = true;
        fxLoop();
      }

      function fxLoop() {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.type === 'confetti') {
            p.vy += 0.05;
            p.rot += p.vr;
            p.life -= 0.003;
          } else {
            p.vx *= 0.99;
            p.vy *= 0.99;
            p.vy += 0.06;
            p.life -= p.decay;
          }

          if (p.life <= 0 || p.y > fxCanvas.height + 30) {
            particles.splice(i, 1);
            continue;
          }

          fxCtx.globalAlpha = Math.max(0, p.life);
          fxCtx.fillStyle = p.color;
          if (p.type === 'confetti') {
            fxCtx.save();
            fxCtx.translate(p.x, p.y);
            fxCtx.rotate(p.rot);
            fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            fxCtx.restore();
          } else {
            fxCtx.beginPath();
            fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fxCtx.fill();
          }
        }
        fxCtx.globalAlpha = 1;

        if (particles.length > 0) {
          requestAnimationFrame(fxLoop);
        } else {
          fxRunning = false;
          fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        }
      }

      function clearFx() {
        fxSession++;
        particles = [];
        fxRunning = false;
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      }

      // ▶ / ❚❚ : liga/desliga música + giro (stop volta tudo ao zero)
      muteBtn.addEventListener('click', function (event) {
        event.preventDefault();
        if (audio.paused) {
          audio.play();
          muteBtn.innerHTML = '❚❚';
          startSpinning();
        } else {
          fullReset();
        }
      });

      // "Sortear" / "Começar do zero"
      sortearBtn.addEventListener('click', function () {
        if (phase === 'spinning') {
          draw();
        } else if (phase === 'done') {
          fullReset();
        }
      });

      // seleção de participantes
      participantsBtn.addEventListener('click', function (event) {
        event.preventDefault();
        showSelector();
      });

      confirmBtn.addEventListener('click', function () {
        if (confirmBtn.disabled) return;
        selectorEl.classList.add('hidden');
        phase = 'idle';
        updateUI();
      });

      selectAllBtn.addEventListener('click', function () {
        selected = faces.map(function () { return true; });
        syncSelector();
        applySelection();
      });

      selectNoneBtn.addEventListener('click', function () {
        selected = faces.map(function () { return false; });
        syncSelector();
        applySelection();
      });

      buildSelector();
      updateUI();
    }());

  </script>
</body>
</html>
